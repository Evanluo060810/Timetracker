<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracker Pro - 高效管理你的每一分钟</title>
    <!-- 外部资源 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                        accent: '#a855f7',
                        categories: {
                            work: '#3b82f6',
                            health: '#10b981',
                            study: '#f59e0b',
                            entertainment: '#ec4899',
                            life: '#6366f1'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.5s ease forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- 自定义样式 -->
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .theme-transition {
                transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            }
            .card-hover {
                transition: all 0.3s ease;
            }
            .card-hover:hover {
                transform: translateY(-5px);
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            }
            .btn-effect {
                transition: all 0.3s ease;
            }
            .btn-effect:hover {
                transform: translateY(-2px);
            }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 theme-transition relative">
    <!-- 装饰图案 -->
    <div class="fixed inset-0 bg-[radial-gradient(rgba(99,102,241,0.1)_1px,transparent_1px)] bg-[size:30px_30px] pointer-events-none z-0 opacity-50 dark:opacity-30"></div>
    
    <!-- 顶部控制区 -->
    <div class="fixed top-4 right-4 z-50 flex gap-3">
        <button id="themeToggleEvanBtn" class="w-10 h-10 rounded-full bg-white dark:bg-gray-800 shadow-lg flex items-center justify-center btn-effect">
            <i class="fa fa-sun-o dark:hidden" aria-hidden="true"></i>
            <i class="fa fa-moon-o hidden dark:block" aria-hidden="true"></i>
        </button>
        <button id="langToggleEvanBtn" class="w-10 h-10 rounded-full bg-white dark:bg-gray-800 shadow-lg flex items-center justify-center btn-effect">
            <span class="text-sm font-medium" id="currentLangEvan">中</span>
        </button>
    </div>
    
    <!-- 通知提示 -->
    <div id="notification" class="fixed top-20 right-4 max-w-xs p-4 rounded-lg shadow-xl transform translate-x-full transition-transform duration-300 z-50 bg-white dark:bg-gray-800 border-l-4 border-green-500">
        <div class="flex items-center gap-3">
            <i class="fa fa-check-circle text-green-500" aria-hidden="true"></i>
            <span id="notificationText">操作成功！</span>
        </div>
    </div>
    
    <!-- 主容器 -->
    <div class="container mx-auto px-4 py-16 max-w-7xl relative z-10">
        <!-- 顶部标题区 -->
        <header class="text-center mb-8 animate-fade-in">
            <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent flex items-center justify-center gap-3">
                <i class="fa fa-clock-o" aria-hidden="true"></i>
                <span id="appTitleEvan">Time Tracker Pro</span>
            </h1>
            <p class="text-[clamp(1rem,2vw,1.25rem)] text-gray-600 dark:text-gray-300 mt-2" id="appSubtitleEvan">高效管理你的每一分钟</p>
        </header>
        
        <!-- 日期选择区 -->
        <div class="flex flex-wrap items-center justify-between mb-8 gap-4 animate-fade-in" style="animation-delay: 0.1s">
            <div class="flex items-center gap-4">
                <button id="prevDayEvanBtn" class="w-10 h-10 rounded-full bg-white dark:bg-gray-800 shadow-md flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-700 btn-effect">
                    <i class="fa fa-chevron-left" aria-hidden="true"></i>
                </button>
                <h2 id="currentDateEvan" class="text-[clamp(1.25rem,3vw,1.75rem)] font-semibold">2025年8月25日 星期一</h2>
                <button id="nextDayEvanBtn" class="w-10 h-10 rounded-full bg-white dark:bg-gray-800 shadow-md flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-700 btn-effect">
                    <i class="fa fa-chevron-right" aria-hidden="true"></i>
                </button>
            </div>
            <div class="flex gap-3">
                <button id="exportDataEvanBtn" class="bg-white dark:bg-gray-800 shadow-md px-4 py-3 rounded-lg font-medium hover:bg-gray-100 dark:hover:bg-gray-700 btn-effect flex items-center gap-2">
                    <i class="fa fa-download" aria-hidden="true"></i>
                    <span id="exportBtnTextEvan">导出数据</span>
                </button>
                <button id="addRecordEvanBtn" class="bg-gradient-to-r from-primary to-secondary text-white px-6 py-3 rounded-lg font-medium shadow-lg btn-effect flex items-center gap-2">
                    <i class="fa fa-plus" aria-hidden="true"></i>
                    <span id="addRecordBtnTextEvan">添加时间记录</span>
                </button>
            </div>
        </div>
        
        <!-- 主体内容区 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- 左栏 -->
            <div class="lg:col-span-1 space-y-6">
                <!-- 今日时间记录卡片 -->
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-lg card-hover animate-fade-in" style="animation-delay: 0.2s">
                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fa fa-list-alt text-primary" aria-hidden="true"></i>
                        <span id="todayRecordsTitleEvan">今日时间记录</span>
                    </h3>
                    <div id="recordsListEvan" class="space-y-4 max-h-[400px] overflow-y-auto pr-2">
                        <!-- 记录将通过JS动态生成 -->
                    </div>
                    <div class="mt-6 pt-4 border-t border-gray-200 dark:border-gray-700">
                        <div class="flex justify-between mb-2">
                            <span class="font-medium" id="totalTimeLabelEvan">今日总计时间：</span>
                            <span id="totalTimeEvan" class="font-bold">0小时</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="font-medium" id="remainingTimeLabelEvan">剩余清醒时间：</span>
                            <span id="remainingTimeEvan" class="font-bold">16小时</span>
                        </div>
                    </div>
                </div>
                
                <!-- 类别管理卡片 -->
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-lg card-hover animate-fade-in" style="animation-delay: 0.3s">
                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fa fa-tags text-primary" aria-hidden="true"></i>
                        <span id="categoriesTitleEvan">类别管理</span>
                    </h3>
                    <div id="categoriesListEvan" class="space-y-3 mb-4">
                        <!-- 类别将通过JS动态生成 -->
                    </div>
                    <button id="addCategoryEvanBtn" class="w-full py-2 border border-dashed border-primary text-primary rounded-lg hover:bg-primary/5 transition-colors flex items-center justify-center gap-2">
                        <i class="fa fa-plus" aria-hidden="true"></i>
                        <span id="addCategoryBtnTextEvan">添加新类别</span>
                    </button>
                </div>
            </div>
            
            <!-- 右栏 -->
            <div class="lg:col-span-2 space-y-6">
                <!-- 时间分配饼图卡片 -->
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-lg card-hover animate-fade-in" style="animation-delay: 0.4s">
                    <div class="flex flex-wrap items-center justify-between mb-6 gap-2">
                        <h3 class="text-xl font-bold flex items-center gap-2">
                            <i class="fa fa-pie-chart text-primary" aria-hidden="true"></i>
                            <span id="timeDistributionTitleEvan">时间分配</span>
                        </h3>
                        <div class="flex border rounded-lg overflow-hidden">
                            <button class="timeRangeBtnEvan active px-4 py-2 bg-primary text-white" data-range="day">
                                <span id="rangeDayEvan">今日</span>
                            </button>
                            <button class="timeRangeBtnEvan px-4 py-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors" data-range="week">
                                <span id="rangeWeekEvan">本周</span>
                            </button>
                            <button class="timeRangeBtnEvan px-4 py-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors" data-range="month">
                                <span id="rangeMonthEvan">本月</span>
                            </button>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-2 h-[300px]">
                            <canvas id="timeDistributionChartEvan"></canvas>
                        </div>
                        <div class="md:col-span-1 space-y-4 overflow-y-auto max-h-[300px] pr-2">
                            <div id="categoryDistributionEvan">
                                <!-- 类别分布将通过JS动态生成 -->
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 趋势分析柱状图卡片 -->
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-lg card-hover animate-fade-in" style="animation-delay: 0.5s">
                    <div class="flex flex-wrap items-center justify-between mb-6 gap-2">
                        <h3 class="text-xl font-bold flex items-center gap-2">
                            <i class="fa fa-bar-chart text-primary" aria-hidden="true"></i>
                            <span id="trendAnalysisTitleEvan">趋势分析</span>
                        </h3>
                        <div class="flex border rounded-lg overflow-hidden">
                            <button class="trendRangeBtnEvan active px-4 py-2 bg-primary text-white" data-range="week">
                                <span id="trendWeekEvan">本周</span>
                            </button>
                            <button class="trendRangeBtnEvan px-4 py-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors" data-range="month">
                                <span id="trendMonthEvan">本月</span>
                            </button>
                            <button class="trendRangeBtnEvan px-4 py-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors" data-range="all">
                                <span id="trendAllEvan">全部</span>
                            </button>
                        </div>
                    </div>
                    <div class="h-[300px]">
                        <canvas id="trendAnalysisChartEvan"></canvas>
                    </div>
                </div>
                
                <!-- 目标追踪卡片 -->
                <div class="bg-white dark:bg-gray-800 rounded-xl p-6 shadow-lg card-hover animate-fade-in" style="animation-delay: 0.6s">
                    <div class="flex flex-wrap items-center justify-between mb-4 gap-2">
                        <h3 class="text-xl font-bold flex items-center gap-2">
                            <i class="fa fa-bullseye text-primary" aria-hidden="true"></i>
                            <span id="goalsTrackingTitleEvan">目标追踪</span>
                        </h3>
                        <button id="addGoalEvanBtn" class="px-4 py-2 border border-dashed border-primary text-primary rounded-lg hover:bg-primary/5 transition-colors flex items-center justify-center gap-2">
                            <i class="fa fa-plus" aria-hidden="true"></i>
                            <span id="addGoalBtnTextEvan">添加目标</span>
                        </button>
                    </div>
                    <div id="goalsListEvan" class="space-y-6">
                        <!-- 目标将通过JS动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加时间记录模态框 -->
    <div id="addRecordEvanModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 rounded-xl p-6 max-w-md w-full mx-4 transform scale-95 transition-transform duration-300">
            <h3 class="text-xl font-bold mb-4" id="addRecordModalTitleEvan">添加时间记录</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="recordNameLabelEvan">事项名称</label>
                    <input type="text" id="recordNameEvan" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-white dark:bg-gray-700 theme-transition" placeholder="输入事项名称">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="categoryLabelEvan">所属类别</label>
                    <select id="categorySelectEvan" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-white dark:bg-gray-700 theme-transition">
                        <!-- 类别选项将通过JS动态生成 -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="durationLabelEvan">时长</label>
                    <div class="flex gap-2">
                        <select id="hoursEvan" class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-white dark:bg-gray-700 theme-transition">
                            <!-- 小时选项将通过JS动态生成 -->
                        </select>
                        <span class="flex items-center" id="hoursTextEvan">小时</span>
                        <select id="minutesEvan" class="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-white dark:bg-gray-700 theme-transition">
                            <!-- 分钟选项将通过JS动态生成 -->
                        </select>
                        <span class="flex items-center" id="minutesTextEvan">分钟</span>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="dateLabelEvan">日期</label>
                    <input type="text" id="recordDateEvan" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 cursor-not-allowed theme-transition" readonly="">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="notesLabelEvan">备注（可选）</label>
                    <textarea id="recordNotesEvan" rows="3" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-white dark:bg-gray-700 theme-transition" placeholder="输入备注信息"></textarea>
                </div>
                <div class="flex gap-3 mt-6">
                    <button id="recordCancelEvanBtn" class="flex-1 px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors theme-transition">
                        <span id="cancelBtnTextEvan">取消</span>
                    </button>
                    <button id="saveRecordEvanBtn" class="flex-1 px-4 py-3 bg-gradient-to-r from-primary to-secondary text-white rounded-lg font-medium btn-effect">
                        <span id="saveBtnTextEvan">保存记录</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加类别模态框 -->
    <div id="addCategoryEvanModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 rounded-xl p-6 max-w-md w-full mx-4 transform scale-95 transition-transform duration-300">
            <h3 class="text-xl font-bold mb-4" id="addCategoryModalTitleEvan">添加新类别</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="categoryNameLabelEvan">类别名称</label>
                    <input type="text" id="categoryNameEvan" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-white dark:bg-gray-700 theme-transition" placeholder="输入类别名称">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="selectColorLabelEvan">选择颜色</label>
                    <div class="grid grid-cols-6 gap-2">
                        <button class="categoryColorBtnEvan w-full aspect-square rounded-full bg-categories-work" data-color="#3b82f6"></button>
                        <button class="categoryColorBtnEvan w-full aspect-square rounded-full bg-categories-health" data-color="#10b981"></button>
                        <button class="categoryColorBtnEvan w-full aspect-square rounded-full bg-categories-study" data-color="#f59e0b"></button>
                        <button class="categoryColorBtnEvan w-full aspect-square rounded-full bg-categories-entertainment" data-color="#ec4899"></button>
                        <button class="categoryColorBtnEvan w-full aspect-square rounded-full bg-categories-life" data-color="#6366f1"></button>
                        <button class="categoryColorBtnEvan w-full aspect-square rounded-full bg-purple-900" data-color="#7e22ce"></button>
                    </div>
                    <input type="hidden" id="categoryColorEvan" value="#6366f1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="selectIconLabelEvan">选择图标</label>
                    <div class="grid grid-cols-6 gap-2">
                        <button class="categoryIconBtnEvan w-full aspect-square rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center" data-icon="briefcase"><i class="fa fa-briefcase text-xl"></i></button>
                        <button class="categoryIconBtnEvan w-full aspect-square rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center" data-icon="heartbeat"><i class="fa fa-heartbeat text-xl"></i></button>
                        <button class="categoryIconBtnEvan w-full aspect-square rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center" data-icon="book"><i class="fa fa-book text-xl"></i></button>
                        <button class="categoryIconBtnEvan w-full aspect-square rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center" data-icon="gamepad"><i class="fa fa-gamepad text-xl"></i></button>
                        <button class="categoryIconBtnEvan w-full aspect-square rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center" data-icon="home"><i class="fa fa-home text-xl"></i></button>
                        <button class="categoryIconBtnEvan w-full aspect-square rounded-lg bg-gray-100 dark:bg-gray-700 flex items-center justify-center" data-icon="car"><i class="fa fa-car text-xl"></i></button>
                    </div>
                    <input type="hidden" id="categoryIconEvan" value="briefcase">
                </div>
                <div class="flex gap-3 mt-6">
                    <button id="categoryCancelEvanBtn" class="flex-1 px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors theme-transition">
                        <span id="categoryCancelBtnTextEvan">取消</span>
                    </button>
                    <button id="saveCategoryEvanBtn" class="flex-1 px-4 py-3 bg-gradient-to-r from-primary to-secondary text-white rounded-lg font-medium btn-effect">
                        <span id="saveCategoryBtnTextEvan">保存类别</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加目标模态框 -->
    <div id="addGoalEvanModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 rounded-xl p-6 max-w-md w-full mx-4 transform scale-95 transition-transform duration-300">
            <h3 class="text-xl font-bold mb-4" id="addGoalModalTitleEvan">添加新目标</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="goalNameLabelEvan">目标名称</label>
                    <input type="text" id="goalNameEvan" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-white dark:bg-gray-700 theme-transition" placeholder="输入目标名称">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="goalCategoryLabelEvan">所属类别</label>
                    <select id="goalCategorySelectEvan" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-white dark:bg-gray-700 theme-transition">
                        <!-- 类别选项将通过JS动态生成 -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" id="dailyGoalHoursLabelEvan">每日目标时长（小时）</label>
                    <input type="number" id="goalHoursEvan" min="0.5" max="18" step="0.5" value="1" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none bg-white dark:bg-gray-700 theme-transition">
                </div>
                <div class="flex gap-3 mt-6">
                    <button id="goalCancelEvanBtn" class="flex-1 px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors theme-transition">
                        <span id="goalCancelBtnTextEvan">取消</span>
                    </button>
                    <button id="saveGoalEvanBtn" class="flex-1 px-4 py-3 bg-gradient-to-r from-primary to-secondary text-white rounded-lg font-medium btn-effect">
                        <span id="saveGoalBtnTextEvan">保存目标</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 导出数据模态框 -->
    <div id="exportDataEvanModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 rounded-xl p-6 max-w-md w-full mx-4 transform scale-95 transition-transform duration-300">
            <h3 class="text-xl font-bold mb-4" id="exportDataTitleEvan">导出数据</h3>
            <p class="text-gray-600 dark:text-gray-400 mb-6" id="exportDataDescEvan">选择导出格式和范围</p>
            <div class="space-y-4">
                <button id="exportAllJsonEvanBtn" class="w-full py-3 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors flex items-center justify-center gap-2 theme-transition">
                    <i class="fa fa-file-code-o text-gray-700 dark:text-gray-300" aria-hidden="true"></i>
