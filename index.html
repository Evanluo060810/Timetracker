<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Tracker Pro - 高效管理你的每一分钟</title>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <!-- Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tailwind 配置 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8A2BE2', // 紫色
            secondary: '#9370DB', // 中紫色
            accent: '#DDA0DD', // 浅紫色
            dark: '#1E0033', // 深紫色
            light: '#F8F4FF', // 浅紫背景
            work: '#FF6B6B',
            health: '#4ECDC4',
            study: '#45B7D1',
            entertainment: '#FFA07A',
            life: '#98D8C8'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'float': 'float 3s ease-in-out infinite',
            'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'slide-in': 'slideIn 0.5s ease-out forwards',
            'fade-in': 'fadeIn 0.5s ease-out forwards',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            slideIn: {
              '0%': { transform: 'translateY(20px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            glow: {
              '0%': { boxShadow: '0 0 5px rgba(138, 43, 226, 0.5)' },
              '100%': { boxShadow: '0 0 20px rgba(138, 43, 226, 0.8)' },
            }
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .glass-effect {
        @apply bg-white bg-opacity-70 backdrop-blur-md;
      }
      .card-hover {
        @apply transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
      }
      .btn-gradient {
        @apply bg-gradient-to-r from-primary to-secondary text-white font-medium py-2 px-4 rounded-lg shadow-md hover:shadow-lg transition-all duration-300 relative overflow-hidden;
      }
      .btn-gradient::after {
        content: '';
        @apply absolute top-0 left-0 w-full h-full bg-white bg-opacity-10 transform -translate-x-full transition-transform duration-500;
      }
      .btn-gradient:hover::after {
        @apply transform translate-x-0;
      }
      .input-field {
        @apply w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-300;
      }
      .category-badge {
        @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium;
      }
      .progress-bar {
        @apply h-2 rounded-full overflow-hidden bg-gray-200;
      }
      .progress-value {
        @apply h-full transition-all duration-500 ease-out;
      }
      .toggle-btn {
        @apply px-3 py-1 rounded-md text-sm font-medium transition-all duration-300;
      }
      .toggle-btn.active {
        @apply bg-primary text-white;
      }
      .toggle-btn:not(.active) {
        @apply bg-gray-200 text-gray-700 hover:bg-gray-300;
      }
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      .animate-glow {
        animation: glow 2s ease-in-out infinite alternate;
      }
      @keyframes glow {
        0% {
          box-shadow: 0 0 5px rgba(138, 43, 226, 0.5);
        }
        100% {
          box-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
        }
      }
      .dark-mode {
        @apply bg-gray-900 text-white;
      }
      .dark-card {
        @apply bg-gray-800 bg-opacity-70 backdrop-blur-md;
      }
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-light to-white min-h-screen transition-colors duration-500">
  <!-- 背景装饰 -->
  <div class="fixed top-0 left-0 w-full h-full overflow-hidden z-0 opacity-10 pointer-events-none">
    <div class="absolute -top-20 -left-20 w-80 h-80 rounded-full bg-primary blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-secondary blur-3xl"></div>
    <div class="absolute top-1/3 -right-20 w-60 h-60 rounded-full bg-accent blur-3xl"></div>
  </div>

  <!-- 页面容器 -->
  <div class="container mx-auto px-4 py-8 relative z-10 max-w-7xl">
    <!-- 顶部导航 -->
    <header class="mb-8 animate-fade-in">
      <div class="flex justify-between items-center">
        <div class="flex items-center">
          <div class="text-primary mr-3 text-3xl">
            <i class="fa fa-clock-o"></i>
          </div>
          <div>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 transition-colors duration-500">Time Tracker Pro</h1>
            <p class="text-gray-600 transition-colors duration-500" data-i18n="subtitle">高效管理你的每一分钟</p>
          </div>
        </div>
        <div class="flex items-center space-x-4">
          <!-- 语言切换 -->
          <div class="flex items-center bg-white bg-opacity-70 rounded-lg p-1 shadow-sm">
            <button id="lang-zh" class="px-3 py-1 rounded-md text-sm font-medium bg-primary text-white">中文</button>
            <button id="lang-en" class="px-3 py-1 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-200">English</button>
          </div>
          <!-- 昼夜模式切换 -->
          <button id="theme-toggle" class="p-2 rounded-full bg-white bg-opacity-70 shadow-sm hover:bg-opacity-100 transition-all duration-300">
            <i class="fa fa-moon-o text-gray-700"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- 日期选择区 -->
    <div class="flex justify-between items-center mb-8 animate-slide-in" style="animation-delay: 0.1s">
      <div class="flex items-center space-x-4">
        <button id="prev-date" class="p-2 rounded-full bg-white bg-opacity-70 shadow-sm hover:bg-opacity-100 transition-all duration-300">
          <i class="fa fa-chevron-left text-gray-700"></i>
        </button>
        <h2 id="current-date" class="text-xl font-semibold text-gray-800 transition-colors duration-500">2025年8月25日 星期一</h2>
        <button id="next-date" class="p-2 rounded-full bg-white bg-opacity-70 shadow-sm hover:bg-opacity-100 transition-all duration-300">
          <i class="fa fa-chevron-right text-gray-700"></i>
        </button>
      </div>
      <button id="add-record-btn" class="btn-gradient flex items-center">
        <i class="fa fa-plus mr-2"></i>
        <span>添加时间记录</span>
      </button>
    </div>

    <!-- 主体内容 -->
    <div class="flex flex-col lg:flex-row gap-6 animate-slide-in" style="animation-delay: 0.2s">
      <!-- 左栏 -->
      <div class="w-full lg:w-1/3 space-y-6">
        <!-- 今日时间记录卡片 -->
        <div class="glass-effect rounded-xl shadow-md p-6 card-hover">
          <h3 class="text-lg font-semibold mb-4 text-gray-800 transition-colors duration-500 flex items-center">
            <i class="fa fa-list-alt text-primary mr-2"></i>
            今日时间记录
          </h3>
          <div id="time-records-list" class="space-y-4 max-h-80 overflow-y-auto pr-2">
            <!-- 时间记录将通过JavaScript动态添加 -->
          </div>
          <div class="mt-6 pt-4 border-t border-gray-200 transition-colors duration-500">
            <div class="flex justify-between items-center mb-2">
              <span class="text-gray-600 transition-colors duration-500" data-i18n="today_total">今日总计</span>
              <span id="total-time" class="font-semibold text-gray-800 transition-colors duration-500">0小时0分钟</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-gray-600 transition-colors duration-500">剩余清醒时间</span>
              <span id="remaining-time" class="font-semibold text-gray-800 transition-colors duration-500">18小时0分钟</span>
            </div>
          </div>
        </div>

        <!-- 类别管理卡片 -->
        <div class="glass-effect rounded-xl shadow-md p-6 card-hover">
          <h3 class="text-lg font-semibold mb-4 text-gray-800 transition-colors duration-500 flex items-center">
            <i class="fa fa-tags text-primary mr-2"></i>
            类别管理
          </h3>
          <div id="categories-list" class="space-y-3">
            <!-- 类别将通过JavaScript动态添加 -->
          </div>
          <div class="mt-4 flex items-center">
            <input type="text" id="new-category-name" placeholder="输入新类别名称" class="input-field flex-1 mr-2">
            <input type="color" id="new-category-color" class="w-10 h-10 rounded-full cursor-pointer border-0" value="#8A2BE2">
            <button id="add-category-btn" class="btn-gradient ml-2">
              <i class="fa fa-plus"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- 右栏 -->
      <div class="w-full lg:w-2/3 space-y-6">
        <!-- 时间分配饼图卡片 -->
        <div class="glass-effect rounded-xl shadow-md p-6 card-hover">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold text-gray-800 transition-colors duration-500 flex items-center">
              <i class="fa fa-pie-chart text-primary mr-2"></i>
              时间分配
            </h3>
            <div class="flex space-x-2">
              <button class="toggle-btn active" data-period="day">今日</button>
              <button class="toggle-btn" data-period="week">本周</button>
              <button class="toggle-btn" data-period="month">本月</button>
            </div>
          </div>
          <div class="flex flex-col md:flex-row items-center">
            <div class="w-full md:w-1/2 h-64">
              <canvas id="time-distribution-chart"></canvas>
            </div>
            <div class="w-full md:w-1/2 mt-4 md:mt-0 md:pl-6">
              <div id="category-distribution-list" class="space-y-3">
                <!-- 类别分布将通过JavaScript动态添加 -->
              </div>
            </div>
          </div>
        </div>

        <!-- 趋势分析柱状图卡片 -->
        <div class="glass-effect rounded-xl shadow-md p-6 card-hover">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold text-gray-800 transition-colors duration-500 flex items-center">
              <i class="fa fa-bar-chart text-primary mr-2"></i>
              趋势分析
            </h3>
            <div class="flex space-x-2">
              <button class="toggle-btn active" data-trend="week">本周</button>
              <button class="toggle-btn" data-trend="month">本月</button>
              <button class="toggle-btn" data-trend="all">全部</button>
            </div>
          </div>
          <div class="h-80">
            <canvas id="trend-analysis-chart"></canvas>
          </div>
        </div>

        <!-- 目标追踪卡片 -->
        <div class="glass-effect rounded-xl shadow-md p-6 card-hover">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-semibold text-gray-800 transition-colors duration-500 flex items-center">
              <i class="fa fa-bullseye text-primary mr-2"></i>
              目标追踪
            </h3>
            <button id="add-goal-btn" class="btn-gradient">
              <i class="fa fa-plus mr-1"></i> 添加目标
            </button>
          </div>
          <div id="goals-list" class="space-y-4">
            <!-- 目标将通过JavaScript动态添加 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加时间记录模态框 -->
  <div id="add-record-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md mx-4 transform transition-all duration-300 scale-95 opacity-0" id="modal-content">
      <h3 class="text-xl font-semibold mb-4 text-gray-800">添加时间记录</h3>
      <div class="space-y-4">
        <div>
          <label for="record-name" class="block text-gray-700 mb-1">事项名称</label>
          <input type="text" id="record-name" class="input-field" placeholder="请输入事项名称">
        </div>
        <div>
          <label for="record-category" class="block text-gray-700 mb-1">所属类别</label>
          <select id="record-category" class="input-field">
            <!-- 类别选项将通过JavaScript动态添加 -->
          </select>
        </div>
        <div>
          <label class="block text-gray-700 mb-1">时长</label>
          <div class="flex space-x-2">
            <select id="record-hours" class="input-field flex-1">
              <!-- 小时选项将通过JavaScript动态添加 -->
            </select>
            <span class="flex items-center">小时</span>
            <select id="record-minutes" class="input-field flex-1">
              <!-- 分钟选项将通过JavaScript动态添加 -->
            </select>
            <span class="flex items-center">分钟</span>
          </div>
        </div>
        <div>
          <label for="record-date" class="block text-gray-700 mb-1">日期</label>
          <input type="date" id="record-date" class="input-field">
        </div>
        <div>
          <label for="record-notes" class="block text-gray-700 mb-1">备注（可选）</label>
          <textarea id="record-notes" class="input-field" rows="2" placeholder="请输入备注信息"></textarea>
        </div>
        <div class="flex justify-end space-x-3 pt-4">
          <button id="cancel-record-btn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors duration-300">取消</button>
          <button id="save-record-btn" class="btn-gradient">保存记录</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 添加目标模态框 -->
  <div id="add-goal-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md mx-4 transform transition-all duration-300 scale-95 opacity-0" id="goal-modal-content">
      <h3 class="text-xl font-semibold mb-4 text-gray-800">添加目标</h3>
      <div class="space-y-4">
        <div>
          <label for="goal-name" class="block text-gray-700 mb-1">目标名称</label>
          <input type="text" id="goal-name" class="input-field" placeholder="请输入目标名称">
        </div>
        <div>
          <label for="goal-category" class="block text-gray-700 mb-1">所属类别</label>
          <select id="goal-category" class="input-field">
            <!-- 类别选项将通过JavaScript动态添加 -->
          </select>
        </div>
        <div>
          <label class="block text-gray-700 mb-1">目标时长（每天）</label>
          <div class="flex space-x-2">
            <select id="goal-hours" class="input-field flex-1">
              <!-- 小时选项将通过JavaScript动态添加 -->
            </select>
            <span class="flex items-center">小时</span>
            <select id="goal-minutes" class="input-field flex-1">
              <!-- 分钟选项将通过JavaScript动态添加 -->
            </select>
            <span class="flex items-center">分钟</span>
          </div>
        </div>
        <div class="flex justify-end space-x-3 pt-4">
          <button id="cancel-goal-btn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors duration-300">取消</button>
          <button id="save-goal-btn" class="btn-gradient">保存目标</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 确认删除模态框 -->
  <div id="confirm-delete-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md mx-4 transform transition-all duration-300 scale-95 opacity-0" id="delete-modal-content">
      <h3 class="text-xl font-semibold mb-4 text-gray-800">确认删除</h3>
      <p class="text-gray-600 mb-6">你确定要删除这条记录吗？此操作无法撤销。</p>
      <div class="flex justify-end space-x-3">
        <button id="cancel-delete-btn" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-100 transition-colors duration-300">取消</button>
        <button id="confirm-delete-btn" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors duration-300">删除</button>
      </div>
    </div>
  </div>

  <!-- 成功提示 -->
  <div id="success-toast" class="fixed top-4 right-4 bg-green-500 text-white px-4 py-2 rounded-lg shadow-lg transform translate-x-full transition-transform duration-300 flex items-center">
    <i class="fa fa-check-circle mr-2"></i>
    <span id="toast-message">操作成功！</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
